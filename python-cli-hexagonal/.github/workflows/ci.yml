name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Sync dependencies
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ty (type check)
        run: uv run ty check
      - name: Tach (architecture)
        run: uv run tach check
      - name: Pytest (with coverage.json for the CRAP sensor)
        run: uv run pytest --cov-report=json
      - name: CRAP metric
        run: uv run crap-sensor --source-dir src/app --coverage-json coverage.json
