[project]
name = "app"
version = "0.1.0"
description = "Plantilla Python CLI con arquitectura hexagonal (ports & adapters)."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "StackAI" }]
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
]

[project.scripts]
app = "app.entrypoint.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "ty>=0.0.1a1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "tach>=0.20",
    "pre-commit>=3.7",
    "crap-sensor",
    "mutmut>=3.0",
]

[tool.uv.sources]
crap-sensor = { path = "../../crap-sensor" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# ---------- Ruff ----------
[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "N",
    "D",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "ANN",
    "ARG",
    "PTH",
    "ERA",
    "TID",
    "Q",
    "PL",
    "RUF",
    "S",
    "BLE",
    "EM",
    "T20",
    "G",
    "PIE",
    "ISC",
]
ignore = [
    "D203",
    "D213",
    "ANN401",
    "PLR0913",
    "COM812",
    "ISC001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S101", "PLR2004"]
"**/__init__.py" = ["D104"]
"src/app/entrypoint/__main__.py" = ["D100"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------- Pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
]

# ---------- ty (type checker) ----------
[tool.ty.environment]
python-version = "3.13"
root = ["./src"]

[tool.ty.src]
include = ["src", "tests"]

# ---------- mutmut ----------
[tool.mutmut]
source_paths = ["src/app"]
