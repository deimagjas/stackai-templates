source_roots = ["src"]
exclude = ["tests", ".venv", "dist", "build"]
exact = true
forbid_circular_dependencies = true

[[modules]]
path = "app.domain"
depends_on = []

[[modules]]
path = "app.adapters"
depends_on = ["app.domain"]

[[modules]]
path = "app.entrypoint"
depends_on = ["app.adapters", "app.domain"]
